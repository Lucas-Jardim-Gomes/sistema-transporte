<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RotaSegura</title>
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/home.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

    <header> <!-- Cabeçalho do site -->
        <div class="logo">
            <img src="assets/imagens/logotipo.png" alt="">
        </div>
        <nav> <!-- Menu de navegação -->
            <ul>
                <li><a href="#">Início</a></li>
                <li><a href="#">Horário</a></li>
                <li><a href="#">Tarifa</a></li>
                <li><a href="#">Contato</a></li>
            </ul>

            <ul id="nav-auth"> <!-- Menu de autenticação -->
                <li><a href="#">Login</a></li>
                <li><a href="#">Cadastro</a></li>
            </ul>
        </nav> 
    </header>

    <main> <!-- Conteúdo principal do site -->

        <section class="hero"> <!-- Seção de destaque -->
            <div class="hero-content">
                <div class="hero-text">
                    <h1>Sua cidade, Seu caminho.</h1>
                    <p>Encontre Rotas, horários e tarifas de forma simples e rápida.</p>
                </div>
                    <div class="hero-form">
                            <form>
                                <div >
                                        <label for="origem">Origem</label>
                                        <input type="text" id="origem" placeholder="Digite sua origem">
                                </div>

                                <div >
                                        <label for="destino">Destino</label>
                                        <input type="text" id="destino" placeholder="Digite seu destino">
                                </div>

                                <div>
                                    <label for="data">Data da Ida</label>
                                    <input type="date" id="data" placeholder="Selecione a data">
                                </div>

                                <div>
                                    <label for="numPessoas">Número de Passageiros</label>
                                        <select id="passageiros">
                                            <option value="1">1 pessoa</option>
                                            <option value="2">2 pessoas</option>
                                            <option value="3">3 pessoas</option>
                                            <option value="4">4 pessoas</option>
                                        </select>
                                </div>

                                <button type="submit" class="btn-search">Buscar Rotas</button>
                            </form>
                    </div>
            </div>

        </section> 

        <section class="Destinos"> <!-- Seção de destinos -->
            <h2>Destinos Populares</h2>
            <div class="destinations-grid">

                <div class="destination-card">
                    <img src="assets/imagens/destino1.jpg" alt="Destino 1">
                    <h3>Destino 1</h3>
                </div>

                <div class="destination-card">
                    <img src="assets/imagens/destino2.jpg" alt="Destino 2">
                    <h3>Destino 2</h3>
                </div>

                <div class="destination-card">
                    <img src="assets/imagens/destino3.jpg" alt="Destino 3">
                    <h3>Destino 3</h3>
                </div>

                <div class="destination-card">
                    <img src="assets/imagens/destino4.jpg" alt="Destino 4">
                    <h3>Destino 4</h3>
                </div>
                
            </div>

        </section>
        <aside class="map">
            
        </aside>
       </main>

       <footer> <!-- Rodapé do site -->
           <p>&copy; 2026 RotaSegura. Todos os direitos reservados.</p>
       </footer>

</body>
</html>
