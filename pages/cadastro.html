<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/cadastro.css">
</head>
<body>
    <main>
        <section class="cadastro-container">
            <h1>RotaSegura</h1>

            <form>


                <label for="nome">Nome:</label> 

                <input type="text" id="nome" name="nome" required placeholder="Digite seu nome completo">  

                <label for="email">Email:</label>   

                <input type="email" id="email" name="username" required placeholder="Digite seu e-mail:">  

                <label for="telefone">Telefone:</label> 
                <input type="tel" id="telefone" name="telefone" required placeholder="Digite seu telefone: (xx) xxxxx-xxxx">  

                <label for="cpf">CPF:</label>   
                <input type="text" id="cpf" name="cpf" required placeholder="Digite seu CPF: xxx.xxx.xxx-xx">  

                <label for="data-nascimento">Data de Nascimento:</label> 
                <input type="date" id="data-nascimento" name="data-nascimento" required placeholder="Digite sua data de nascimento:">   

                <label for="cep">CEP:</label>  
                <input type="text" id="cep" name="cep" required placeholder="Digite seu CEP: xxxxx-xxx">  

                <label for="password">Senha:</label> 
                <input type="password" id="password" name="password" required placeholder="Digite sua senha"> 

                <label for="confirm-password">Confirmar Senha:</label> 
                <input type="password" id="confirm-password" name="confirm-password" required placeholder="Confirme sua senha"> 

                <button type="submit">Cadastrar</button> 

            </form>

        </section>
    </main>
</body>
</html>
